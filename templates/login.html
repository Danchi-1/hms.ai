<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - hms_AI Health Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Premium Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <div class="auth-page">
        <!-- Floating Ambient Elements -->
        <div class="ambient-light"></div>

        <a href="{{ url_for('home') }}" class="home-button">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="auth-container">
            <div class="auth-header">
                <h1>Hub.ai</h1>
                <p>Welcome back! Log in to continue monitoring your health</p>
            </div>

            <div class="auth-tabs">
                <span class="auth-tab active">Login</span>
                <a href="{{ url_for('signup_page') }}" class="auth-tab">Sign Up</a>
            </div>

            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-input" id="email" name="email" required
                        placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" required
                        placeholder="Enter your password">
                </div>

                <div class="form-group" style="text-align: right; margin-top: -10px;">
                    <a href="#" class="terms-link" style="font-size: 0.9rem;">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-button" id="loginBtn">
                    <span class="btn-text">Log In</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('signup_page') }}" class="auth-link">Create one here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}?v=3.0"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');

            form.addEventListener('submit', (e) => {
                btn.classList.add('loading');
            });
        });
    </script>
</body>

</html>
